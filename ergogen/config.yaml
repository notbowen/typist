# Ferris-Sweep-style 34-key wireless split (Choc spacing, 5x3 + 2 thumbs per half)
# ONE REVERSIBLE PCB for both halves: order a single design, flip one board over for
# the right half. Every part has pads on both faces; populate the face that is up
# (XIAO, power switch, LEDs) or down (hotswap sockets, diodes, battery jack) for
# that half.
# - key positions and board outline follow the open-source Ferris Sweep 2.2
#   (github.com/davidphilipbarr/Sweep, Solderpad Hardware License 2.1); pinky edge,
#   inner notch and controller tab grown ~2 mm for the double-sided hotswap pads
# - controller: Seeed XIAO nRF52840, flat SMD mount
# - 4x5 diode matrix: columns C0..C4 (pinky..inner) = D0..D4,
#   rows R0..R3 (top, home, bottom, thumb) = D5, D8, D9, D10
# - 4 status LEDs (0805 + 0805 resistor): LED1 = D6, LED2 = D7, LED3 = P0.09 (NFC1),
#   LED4 = P0.10 (NFC2) - every XIAO GPIO is used
# - LiPo on a JST-SH plug (bottom face), side power switch, no TRRS (ZMK BLE split)
# All coordinates mirror the reference: ergogen (x, y) == KiCad (x, -y).
meta:
  engine: 4.2.1
  name: sweep-xiao-ble-reversible
  version: 0.3.0
  author: lapiz

units:
  kx: cx              # choc key spacing 18 x 17 mm
  ky: cy
  # controller-tab parts, relative to the pinky-bottom switch (mm, y up)
  mcu_x: 91.294       # XIAO centre (tab widened 2.3 mm, XIAO pads clear the inner sockets)
  mcu_y: 21.712       # USB-C face flush with the tab's top edge
  pwr_x: 99.034       # side-actuated power switch on the tab's outer edge
  pwr_y: 6.382
  pwr_rot: -90
  jst_x: 92.544       # battery jack (bottom face), cable entry facing the cell
  jst_y: -5.118
  jst_rot: 0
  # status LEDs: a row in the open area below the middle column, between the ring
  # and index bottom keys and left of the thumbs, tilted to follow the bottom edge
  # (edge slope there -6.2..-8.7 deg) and kept ~5 mm clear of it
  led_x: 38.144       # row centre (between LED2 and LED3)
  led_y: -2.718
  led_rot: -8
  led_dx: 3.5650      # 3.6 mm pitch along the row: 3.6 cos 8, -3.6 sin 8
  led_dy: -0.5010

points:
  zones:
    matrix:
      anchor:
        shift: [139.856, -83.382]   # Sweep 2.2 left pinky-bottom switch
      key:
        padding: ky
        spread: kx
      columns:
        pinky:
          key.column_net: C0
        ring:
          key.stagger: 12.008
          key.column_net: C1
        middle:
          key.stagger: 6.858
          key.column_net: C2
        index:
          key.stagger: -5.334
          key.column_net: C3
        inner:
          key.stagger: -2.54
          key.column_net: C4
      rows:
        bottom:
          row_net: R2
        home:
          row_net: R1
        top:
          row_net: R0
    thumb:
      anchor:
        ref: matrix_pinky_bottom
        shift: [63.97, -6.7]
        rotate: -15
      key:
        row_net: R3
      columns:
        tucky:
          key.column_net: C3
        reachy:
          key.spread: 20.0
          key.stagger: -2.92
          key.splay: -15
          key.origin: [0, 0]
          key.column_net: C4
      rows:
        cluster:

outlines:
  board:
    - what: polygon
      points:
        - ref: matrix_pinky_bottom
          shift: [-10.222, 43.296]
          resist: true
        - shift: [-0.066, -0.37]
          resist: true
