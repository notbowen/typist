# Ferris-Sweep-style 34-key wireless split (Choc spacing, 5x3 + 2 thumbs per half)
# - key positions and board outline follow the open-source Ferris Sweep 2.2
#   (github.com/davidphilipbarr/Sweep, Solderpad Hardware License 2.1)
# - controller: Seeed Studio XIAO nRF52840, flat SMD mount on the top side
# - 4x5 diode matrix (XIAO has 11 GPIO, a 17-key half needs 9 with a matrix):
#   columns C0..C4 (pinky..inner) = D0..D4, rows R0..R3 (top, home, bottom, thumb) = D5, D8, D9, D10
# - LiPo cell under the controller tab on a JST-SH plug (detachable), side power switch
# - no TRRS: halves talk over BLE (ZMK split)
# All coordinates mirror the reference: ergogen (x, y) == KiCad (x, -y).
meta:
  engine: 4.2.1
  name: sweep-xiao-ble
  version: 0.2.0
  author: lapiz

units:
  kx: cx              # choc key spacing 18 x 17 mm
  ky: cy
  # controller-tab parts, relative to the pinky-bottom switch (mm, y up)
  mcu_x: 90.094       # XIAO centre; USB-C face flush with the tab's top edge
  mcu_y: 21.712
  pwr_x: 98.544       # side-actuated power switch on the tab's outer edge
  pwr_y: 6.382
  pwr_rot: -90
  jst_x: 91.344       # battery connector on the back, cable entry facing the cell
  jst_y: -5.118
  jst_rot: 0
  jst_x_r: 88.844     # right half: same offset from the (unmirrored) XIAO as on the left

points:
  zones:
    matrix:
      anchor:
        shift: [139.856, -83.382]   # Sweep 2.2 left pinky-bottom switch
      key:
        padding: ky
        spread: kx
      columns:
        pinky:
          key.column_net: C0
        ring:
          key.stagger: 12.008
          key.column_net: C1
        middle:
          key.stagger: 6.858
          key.column_net: C2
        index:
          key.stagger: -5.334
          key.column_net: C3
        inner:
          key.stagger: -2.54
          key.column_net: C4
      rows:
        bottom:
          row_net: R2
        home:
          row_net: R1
        top:
          row_net: R0
    thumb:
      anchor:
        ref: matrix_pinky_bottom
        shift: [63.97, -6.7]
        rotate: -15
      key:
        row_net: R3
      columns:
        tucky:
          key.column_net: C3
        reachy:
          key.spread: 20.0
          key.stagger: -2.92
          key.splay: -15
          key.origin: [0, 0]
          key.column_net: C4
      rows:
        cluster:
  mirror:
    ref: matrix_inner_home
    distance: 80

outlines:
  left_board:
    - what: polygon
      points:
        - ref: matrix_pinky_bottom
