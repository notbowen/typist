pcbs:
# Socket orientation follows the Sweep Bling LP (Kailh hotswap variant): every
# hotswap socket faces away from the nearest board edge.
  left:
    template: kicad8
    outlines:
      edge:
        outline: left_board
    footprints:
      keys_a:
        what: choc
        where: "/^matrix_pinky_/"
        adjust:
          rotate: 0
        params:
          hotswap: true
          keycaps: true
          from: "{{column_net}}"
          to: "{{name}}"
      diodes_a:
        what: diode_sod123
        where: "/^matrix_pinky_/"
        adjust:
          shift: [0, -5]
          rotate: 0
        params:
          from: "{{name}}"
          to: "{{row_net}}"
      keys_b:
        what: choc
        where: "/^(matrix_(ring|middle|index|inner)|thumb)_/"
        adjust:
          rotate: 180
        params:
          hotswap: true
          keycaps: true
          from: "{{column_net}}"
          to: "{{name}}"
      diodes_b:
        what: diode_sod123
        where: "/^(matrix_(ring|middle|index|inner)|thumb)_/"
        adjust:
          shift: [0, 5]
          rotate: 180
        params:
          from: "{{name}}"
          to: "{{row_net}}"
      hole1:
        what: mounting_hole
        where: matrix_pinky_bottom
        adjust:
          shift: [64.062, 55.188]
      hole2:
        what: mounting_hole
        where: matrix_pinky_bottom
        adjust:
          shift: [7.049, 45.028]
      hole3:
        what: mounting_hole
        where: matrix_pinky_bottom
        adjust:
          shift: [10.623, 0.962]
      mcu:
        what: xiao_nrf52840
        where: matrix_pinky_bottom
        adjust:
          shift: [mcu_x, mcu_y]
        params:
          D0: C0
          D1: C1
          D2: C2
          D3: C3
          D4: C4
          D5: R0
          D8: R1
          D9: R2
          D10: R3
          D6: ""             # D6/D7 = UART TX/RX, left free
          D7: ""
          V5: ""
          V3: ""
          GND: GND
          BATP: BAT_SW
          BATN: GND
      power:
        what: slider
        where: matrix_pinky_bottom
        adjust:
          shift: [pwr_x, pwr_y]
          rotate: pwr_rot
        params:
          from: BAT_RAW
          to: BAT_SW
      battery:
        what: jst_sh2
        where: matrix_pinky_bottom
        adjust:
          shift: [jst_x, jst_y]
          rotate: jst_rot
        params:
          pos: BAT_RAW
          neg: GND

  right:
    template: kicad8
    outlines:
      edge:
        outline: right_board
    footprints:
      keys_a:
        what: choc
        where: "/^mirror_matrix_inner_/"
        adjust:
          rotate: 0
        params:
          hotswap: true
          keycaps: true
          from: "{{column_net}}"
          to: "{{name}}"
      diodes_a:
        what: diode_sod123
        where: "/^mirror_matrix_inner_/"
        adjust:
          shift: [0, -5]
          rotate: 0
        params:
          from: "{{name}}"
          to: "{{row_net}}"
      keys_b:
        what: choc
        where: "/^mirror_matrix_(pinky|ring|middle|index)_/"
        adjust:
          rotate: 180
        params:
          hotswap: true
          keycaps: true
          from: "{{column_net}}"
          to: "{{name}}"
      diodes_b:
        what: diode_sod123
        where: "/^mirror_matrix_(pinky|ring|middle|index)_/"
        adjust:
          shift: [0, 5]
          rotate: 180
        params:
          from: "{{name}}"
          to: "{{row_net}}"
      keys_c:
        what: choc
        where: "/^mirror_thumb_/"
        adjust:
          rotate: 0
        params:
          hotswap: true
          keycaps: true
          from: "{{column_net}}"
          to: "{{name}}"
      diodes_c:
        what: diode_sod123
        where: "/^mirror_thumb_/"
        adjust:
          shift: [0, -5]
          rotate: 0
        params:
          from: "{{name}}"
          to: "{{row_net}}"
      hole1:
        what: mounting_hole
        where: mirror_matrix_pinky_bottom
        adjust:
          shift: [64.062, 55.188]
      hole2:
        what: mounting_hole
        where: mirror_matrix_pinky_bottom
        adjust:
          shift: [7.049, 45.028]
      hole3:
        what: mounting_hole
        where: mirror_matrix_pinky_bottom
        adjust:
          shift: [10.623, 0.962]
      mcu:
        what: xiao_nrf52840
        where: mirror_matrix_pinky_bottom
        adjust:
          shift: [mcu_x, mcu_y]
        params:
          D0: C0
          D1: C1
          D2: C2
          D3: C3
          D4: C4
          D5: R0
          D8: R1
          D9: R2
          D10: R3
          D6: ""             # D6/D7 = UART TX/RX, left free
          D7: ""
          V5: ""
          V3: ""
          GND: GND
          BATP: BAT_SW
          BATN: GND
      power:
        what: slider
        where: mirror_matrix_pinky_bottom
        adjust:
          shift: [pwr_x, pwr_y]
          rotate: pwr_rot
        params:
          from: BAT_RAW
          to: BAT_SW
      battery:
        what: jst_sh2
        where: mirror_matrix_pinky_bottom
        adjust:
          shift: [jst_x_r, jst_y]
          rotate: jst_rot
        params:
          pos: BAT_RAW
          neg: GND
