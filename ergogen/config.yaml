pcbs:
# Socket orientation follows the Sweep Bling LP; with pads on both faces one set
# faces an edge, which is why the outline is grown there.
  sweep:
    template: kicad8
    outlines:
      edge:
        outline: board
    footprints:
      keys_a:
        what: choc_rev
        where: "/^(matrix_pinky|thumb_reachy)_/"
        adjust:
          rotate: 0
        params:
          from: "{{column_net}}"
          to: "{{name}}"
      diodes_a:
        what: diode_sod123
        where: "/^(matrix_pinky|thumb_reachy)_/"
        adjust:
          shift: [0, -5]
          rotate: 0
        params:
          reversible: true
          from: "{{name}}"
          to: "{{row_net}}"
      keys_b:
        what: choc_rev
        where: "/^(matrix_(ring|middle|index|inner)|thumb_tucky)_/"
        adjust:
          rotate: 180
        params:
          from: "{{column_net}}"
          to: "{{name}}"
      diodes_b:
        what: diode_sod123
        where: "/^(matrix_(ring|middle|index|inner)|thumb_tucky)_/"
        adjust:
          shift: [0, 5]
          rotate: 180
        params:
          reversible: true
          from: "{{name}}"
          to: "{{row_net}}"
      hole1:
        what: mounting_hole
        where: matrix_pinky_bottom
        adjust:
          shift: [64.062, 55.188]
      hole2:
        what: mounting_hole
        where: matrix_pinky_bottom
        adjust:
          shift: [6.449, 45.528]    # Sweep hole moved 0.8 mm: a 4 mm hex standoff clears the ring-top socket
      hole3:
        what: mounting_hole
        where: matrix_pinky_bottom
        adjust:
          shift: [11.123, 0.162]    # Sweep hole moved 0.9 mm: clears the pinky-bottom socket
      led1:
        what: led_0805
        where: matrix_pinky_bottom
        adjust:
          shift: [led_x - 1.5 * led_dx, led_y - 1.5 * led_dy]
          rotate: led_rot
        params:
          gpio: LED1
          mid: LED1_A
          gnd: GND
      led2:
        what: led_0805
        where: matrix_pinky_bottom
        adjust:
          shift: [led_x - 0.5 * led_dx, led_y - 0.5 * led_dy]
          rotate: led_rot
        params:
          gpio: LED2
          mid: LED2_A
          gnd: GND
      led3:
        what: led_0805
        where: matrix_pinky_bottom
        adjust:
          shift: [led_x + 0.5 * led_dx, led_y + 0.5 * led_dy]
          rotate: led_rot
        params:
          gpio: LED3
          mid: LED3_A
          gnd: GND
      led4:
        what: led_0805
        where: matrix_pinky_bottom
        adjust:
          shift: [led_x + 1.5 * led_dx, led_y + 1.5 * led_dy]
          rotate: led_rot
        params:
          gpio: LED4
          mid: LED4_A
          gnd: GND
      mcu:
        what: xiao_nrf52840
        where: matrix_pinky_bottom
        adjust:
          shift: [mcu_x, mcu_y]
        params:
          reversible: true
          D0: C0
          D1: C1
          D2: C2
          D3: C3
          D4: C4
          D5: R0
          D8: R1
          D9: R2
          D10: R3
          D6: LED1
          D7: LED2
          NFC1: LED3
          NFC2: LED4
          V5: ""
          V3: ""
          GND: GND
          BATP: BAT_SW
          BATN: GND
      power:
        what: power_switch_rev
        where: matrix_pinky_bottom
        adjust:
          shift: [pwr_x, pwr_y]
          rotate: pwr_rot
        params:
          from: BAT_RAW
          to: BAT_SW
      battery:
        what: jst_sh2
        where: matrix_pinky_bottom
        adjust:
          shift: [jst_x, jst_y]
          rotate: jst_rot
        params:
          reversible: true
          pos: BAT_RAW
          neg: GND
