# Report each half's LiPo level to the host (XIAO BLE VBAT divider is supported by the board)
# (the left half also fetches/proxies the right half's level: Kconfig.defconfig)
CONFIG_ZMK_BATTERY_REPORTING=y
# Deep sleep after 15 min idle (wakes on key press)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 4 status LEDs (gpio-leds `status_leds`), driven by the sweep-status-leds module in
# this repo (src/, Kconfig). Options: CONFIG_SWEEP_STATUS_LEDS_* (see ../Kconfig), e.g.
# CONFIG_SWEEP_STATUS_LEDS_LAYER=n, CONFIG_SWEEP_STATUS_LEDS_CONN_TIMEOUT_S=60
CONFIG_LED=y
CONFIG_LED_GPIO=y
