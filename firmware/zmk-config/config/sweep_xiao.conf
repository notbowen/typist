# Report each half's LiPo level to the host (XIAO BLE VBAT divider is supported by the board)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Deep sleep after 15 min idle (wakes on key press)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# P0.09 / P0.10 (the XIAO's NFC pads) drive LED3 / LED4 as plain GPIO.
# (Zephyr >= 3.7 / ZMK on Zephyr 4.x: use `&uicr { nfct-pins-as-gpios; };` in the
# overlay instead of this option.)
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_LED=y
CONFIG_LED_GPIO=y
