# Generic PrusaSlicer profile used for printability checks (0.4 mm nozzle, PLA).
# Adjust to your printer; scripts/cad/slice.sh passes it with --load.
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.24
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = gyroid
support_material = 0
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
gcode_flavor = marlin2
